:root{
  --bg:#f3f1ec;--card:#fff;--ink:#1d2a2f;--muted:#6b7778;--line:#e1ddd4;
  --brand:#1f4e5f;--abs:#c0392b;--absbg:#fdecea;--exc:#b7791f;--excbg:#fdf4e3;--ok:#2e7d4f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Naskh","Noto Naskh Arabic",Tahoma,sans-serif;font-synthesis:none;font-size:17px;line-height:1.6;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px}
header .ttl{flex:1;min-width:0}
header h1{margin:0;font-size:20px}
header .sub{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;background:rgba(255,255,255,.15);border-radius:10px;padding:3px;flex:none}
.lang button{border:0;background:none;color:#fff;padding:4px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.lang button.on{background:#fff;color:var(--brand);font-weight:700}
main{max-width:820px;margin:0 auto;padding:14px 12px}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:14px;color:var(--muted);cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:18px}
.grade-label{font-size:13px;color:var(--muted);margin:4px 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;min-width:62px;text-align:center;font-weight:700;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{display:block;font-weight:400;font-size:11px;opacity:.75;line-height:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=date],input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
textarea{min-height:260px;line-height:1.8}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.red{background:var(--abs)}
.btn.sm{padding:6px 10px;font-size:14px}
.x{border:0;background:#f1e3e1;color:var(--abs);border-radius:8px;width:34px;height:38px;font-size:18px;cursor:pointer;flex:none!important}
.note{font-size:14px;color:var(--muted)}
.warn{background:var(--excbg);color:#7a5210;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
.stats{display:flex;gap:8px;margin:2px 0 10px}
.stat{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.stat b{display:block;font-size:22px}
.stat.a b{color:var(--abs)} .stat.e b{color:var(--exc)} .stat.p b{color:var(--ok)}
.list{display:flex;flex-direction:column;gap:6px}
.stu{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;min-height:52px}
.stu .n{width:30px;height:30px;border-radius:50%;background:#eef2f3;display:grid;place-items:center;font-size:14px;flex:none}
.stu .nm{flex:1;font-weight:700}
.stu .tot{font-size:12px;color:var(--muted);font-weight:400}
.stu .st{font-size:13px;font-weight:700;border-radius:8px;padding:2px 10px;flex:none}
.stu.abs{background:var(--absbg);border-color:var(--abs)}
.stu.abs .n,.stu.abs .st{background:var(--abs);color:#fff}
.stu.exc{background:var(--excbg);border-color:var(--exc)}
.stu.exc .n,.stu.exc .st{background:var(--exc);color:#fff}
.saved{font-size:13px;color:var(--ok);min-height:20px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.hidden{display:none!important}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.gbox{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fafaf8}
.gbox .row{margin-bottom:8px}
.secs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sec-ed{display:flex;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:2px 4px}
.sec-ed input{width:64px!important;border:0!important;padding:6px 4px!important;text-align:center;font-weight:700}
.sec-ed small{color:var(--muted);font-size:11px}
.sec-ed .mvs{border:0;background:none;color:var(--muted);font-size:11px;padding:4px 2px;cursor:pointer}
.gbox .mv{flex:0 0 34px;height:40px;border:1.5px solid var(--line);background:#fff;border-radius:10px;color:var(--brand);font-size:13px;cursor:pointer}
.sec-ed button{border:0;background:none;color:var(--abs);font-size:16px;cursor:pointer;padding:2px 4px}
.newg{border:1.5px dashed var(--brand);border-radius:12px;padding:10px;background:#f4f8f9}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
th{background:#eef2f3;font-weight:700}
td.nm{text-align:right;position:sticky;right:0;background:#fff}
th.nm{position:sticky;right:0}
td.A{color:var(--abs);font-weight:700} td.E{color:var(--exc);font-weight:700}
td.tot{font-weight:700}
tr.hi td{background:var(--absbg)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#1d2a2f;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
.seg{display:flex;flex-wrap:wrap;background:#eef2f3;border-radius:12px;padding:4px;margin-top:10px}
.seg button{flex:1 1 22%;border:0;background:none;padding:8px 2px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer;font-size:14px;line-height:1.35}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg button[data-m="par"].on{color:#1d6b46}
:root{--par:#1d6b46;--parbg:#e8f5ee}
#tBody{--mc:var(--par);--mcbg:var(--parbg)}
#tBody.mk-clean{--mc:#8d5b2a;--mcbg:#f7efe6}
#tBody.mk-noise{--mc:#6b3fa0;--mcbg:#f1ebf8}
#tBody.mk-neg{--mc:#a0453a;--mcbg:#fbecea}
.sub-ed{border:1px solid #e3e8ea;border-radius:10px;padding:8px;margin-bottom:8px}.sub-ed select{margin-top:6px}
.trk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #eef2f3}
.trk input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
.trk .tn{flex:1;font-weight:700}.trk .ck{width:22px;text-align:center;color:var(--brand);font-weight:700}.trk small{color:var(--muted);font-weight:400}
.seg button[data-m="clean"].on{color:#8d5b2a}
.seg button[data-m="noise"].on{color:#6b3fa0}
.stu.has{background:var(--mcbg);border-color:var(--mc)}
.stu.has .n{background:var(--mc);color:#fff}
.stu .pc{font-weight:700;color:var(--mc);font-size:14px;min-width:44px;text-align:center;flex:none}

    var tl=tt?[tt.A?t("nAbs",{n:tt.A}):"",tt.E?t("nExc",{n:tt.E}):""].filter(Boolean).join(" ، "):"";
    h+='<div class="stu'+cls+'" data-id="'+st.id+'"><span class="n">'+(i+1)+'</span><span class="nm">'+esc(st.name)+
       (tl?'<div class="tot">'+t("total")+tl+"</div>":"")+"</span>"+(v?'<span class="st">'+t(v==="A"?"absent":"excused")+"</span>":"")+"</div>";
  });

     (started?'<button class="btn ghost" id="tClear">'+t("clearDay")+"</button>":'<button class="btn ghost" id="tAllP">'+t("allPresent")+"</button>")+
     '</div><div class="saved">'+(started?t("autoSaved",{d:fmtD(date)}):"")+"</div>";
  $("tBody").innerHTML=h;

function shareAbs(s,date){
  var m=D.records[rk(s.id,date)]||{},A=[],E=[];
  s.students.forEach(function(st){if(m[st.id]==="A")A.push(st.name);else if(m[st.id]==="E")E.push(st.name)});
  var num=function(a){return a.map(function(n,i){return(i+1)+"- "+n}).join("\n")};
  var x=t("shareHead",{s:fullName(s)})+(subjOf(s)?" — "+subjOf(s):"")+"\n"+fmtD(date)+"\n\n";
  x+=A.length?t("absList",{n:A.length})+"\n"+num(A):t("noAbs");
  if(E.length)x+="\n\n"+t("excList",{n:E.length})+"\n"+num(E);
  if(navigator.share){navigator.share({text:x}).catch(function(){});return}
  copy(x);
}
function copy(x){
  function fb(){var ta=document.createElement("textarea");ta.value=x;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(t("copied"))}catch(e){info(x)}ta.remove()}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(x).then(function(){toast(t("copied"))},fb);else fb();
}

function setNames(s,names){
  var byName={},seen={};s.students.forEach(function(x){byName[x.name]=x.id});
  s.students=names.map(function(n){return n.replace(/^\s*[\d٠-٩۰-۹]+\s*[-.)ـ٫]?\s*/,"").replace(/\s+/g," ").trim()})
    .filter(function(n){if(!n||seen[n])return false;seen[n]=1;return true})
    .map(function(n){return{id:byName[n]||uid(),name:n}});
}

function fillRSec(){
  var el=$("rSec");
  if(isGradeRep()){
    $("rSecL").textContent=t("gradeLbl");
    if(el.dataset.k!=="g"){
      el.innerHTML=D.grades.filter(function(g){return secsOf(g.id).length}).map(function(g){return'<option value="'+g.id+'">'+esc(gTitle(g))+"</option>"}).join("");
      el.dataset.k="g";
      if(D.ui.rGrade&&el.querySelector('option[value="'+D.ui.rGrade+'"]'))el.value=D.ui.rGrade;
      if($("rPeriod").value==="all"){var cm=ymd(new Date()).slice(0,7);if($("rPeriod").querySelector('option[value="'+cm+'"]'))$("rPeriod").value=cm}
    }
  }else{
    $("rSecL").textContent=t("section");
    if(el.dataset.k==="g"){el.dataset.k="";fillSelect(el,D.ui.sec)}
  }
  $("rShare").classList.toggle("hidden",!isGradeRep());

function collectBlocks(root){
  var out=[];
  (function walk(el,center){
    [].forEach.call(el.childNodes,function(n){
      if(n.nodeType===3){var x=n.textContent.trim();if(x)out.push({k:"p",t:x,center:center});return}

      var cl=n.classList;

      if(n.tagName==="H2"){out.push({k:"h2",t:nodeText(n)});return}
      if(n.tagName==="H3"){out.push({k:"h3",t:nodeText(n)});return}
      if(cl.contains("print-credit"))return;
      if(cl.contains("sheet-head")){var sp=n.children;out.push({k:"row2",a:sp[0]?nodeText(sp[0]):"",b:sp[1]?nodeText(sp[1]):""});return}
      var leaf=[].every.call(n.children,function(c){return INL[c.tagName]});
      if(leaf){var x=nodeText(n);if(x)out.push({k:"p",t:x,center:center||cl.contains("print-head"),warn:cl.contains("warn")});return}

function parseData(text){
  // accepts a backup .json OR a register .html saved with data; tolerant of BOM / renamed extensions
  text=String(text||"").replace(/^\uFEFF/,"").trim();
  if(!text)return{err:"impEmpty"};
  var m=text.match(EMB_RE);if(m)text=text.slice(text.indexOf(m[1])+m[1].length,text.indexOf("<\/script>",text.indexOf(m[1]))).trim();
  try{var x=JSON.parse(text)}catch(e){return{err:"impBad"}}
  if(!x||!x.sections||!x.records)return{err:"impBad"};
  return{data:x};
}

/* ================= GRADEBOOK (optional) ================= */
function gbCfg(){
  if(!D.gbCfg)D.gbCfg={v2:1,on:false,months:1,comps:[{id:"c1",n:"",max:10},{id:"c2",n:"",max:20},{id:"c3",n:"",max:10},{id:"c4",n:"",max:60}]};
  var c=D.gbCfg;
  if(!c.v2){ // old default (2 months, unnamed comps) -> one block per semester
    if(c.months===2&&c.comps.length===4&&c.comps.every(function(x,i){return x.id==="c"+(i+1)&&!x.n}))c.months=1;
    c.v2=1;
  }
  if(!c.v3){ // split the two 10-mark evaluations into 5 x 2
    var ev=0;c.comps.forEach(function(x){if(x.id==="c1"||x.id==="c3"){if(+x.max===10){x.sub=1;x.ev=++ev}}});
    c.months=1;c.v3=1;
  }
  if(!c.per){var y=+schoolYear().split("-")[1];
    c.per={1:{start:y+"-09-20",mid:y+"-11-08",end:y+"-12-14"},2:{start:(y+1)+"-01-03",mid:(y+1)+"-02-21",end:(y+1)+"-04-09"}}}
  c.comps.forEach(function(x){if(x.sub)x.max=subMax()});
  return c;
}
function evSubs(){var c=D.gbCfg||gbCfg();if(!c.subs)c.subs=[{id:"par",src:"par",max:2},{id:"cq",src:"cq",max:2},{id:"att",src:"att",max:2},{id:"q1",src:"man",max:2},{id:"q2",src:"man",max:2}];return c.subs}
var SUBDEF={par:"subPar",cq:"subCq",att:"subAtt"};
function subName(x){return x.n||(SUBDEF[x.id]?t(SUBDEF[x.id]):x.id==="q1"?t("subQ",{n:1}):x.id==="q2"?t("subQ",{n:2}):t("newSub"))}
function subMax(){return evSubs().reduce(function(a,x){return a+(+x.max||0)},0)}
/* sources an evaluation field can be computed from: dir +1 = each mark adds, -1 = each mark deducts */
function srcAll(){
  var l=[{k:"att",n:t("modeAtt"),dir:-1,on:true},{k:"par",n:t("modePar"),dir:1,on:trkOn("par"),store:["part"]},
    {k:"clean",n:t("modeClean"),dir:-1,on:trkOn("clean"),store:["clean"]},{k:"noise",n:t("modeNoise"),dir:-1,on:trkOn("noise"),store:["noise"]},
    {k:"cq",n:t("modeClean")+" + "+t("modeNoise"),dir:-1,on:trkOn("clean")||trkOn("noise"),store:["clean","noise"].filter(trkOn)}];
  (D.custom||[]).forEach(function(c){var m=MK["x"+c.id];l.push({k:"x"+c.id,n:m?m.label:c.name,dir:c.type==="pos"?1:-1,on:true,store:["cx_"+c.id]})});
  return l;
}
function srcOf(k){if(k==="man")return null;var r=srcAll().filter(function(x){return x.k===k})[0];return r&&r.on?r:null}
var EVM={};
function evRange(sem,ev){var p=gbCfg().per[sem]||{};return ev===1?[p.start,p.mid,false]:[p.mid,p.end,true]}
function inRange(d,r){return d>=r[0]&&(r[2]?d<=r[1]:d<r[1])}
function evStats(secId,sem,ev){
  var k=SAVEV+"|"+secId+"|"+sem+"|"+ev;if(EVM.v===SAVEV&&EVM[k])return EVM[k];
  var r=evRange(sem,ev),o={lessons:0,A:{},st:{}};
  if(r[0]&&r[1]){
    recordsOf(secId).forEach(function(x){if(!inRange(x.date,r))return;o.lessons++;for(var s in x.m)if(x.m[s]==="A")o.A[s]=(o.A[s]||0)+1});
    ["part","clean","noise"].concat((D.custom||[]).map(function(c){return"cx_"+c.id})).forEach(function(stn){
      var m=o.st[stn]={};recordsOf(secId,D[stn]||{}).forEach(function(x){if(!inRange(x.date,r))return;for(var s in x.m)m[s]=(m[s]||0)+x.m[s]})});
  }
  if(EVM.v!==SAVEV)EVM={v:SAVEV};EVM[k]=o;return o;
}
function subVals(secId,stuId,sem,m,c){
  var st=evStats(secId,sem,c.ev),o=gGet(secId,stuId,gKey(sem,m)),v={lessons:st.lessons,items:[]};
  evSubs().forEach(function(x){
    var src=srcOf(x.src),it={sub:x,max:+x.max||0,auto:!!src};
    if(src){
      if(st.lessons){
        var cnt=src.k==="att"?(st.A[stuId]||0):src.store.reduce(function(a,sn){return a+((st.st[sn]||{})[stuId]||0)},0);
        it.cnt=cnt;it.val=src.dir>0?Math.min(it.max,cnt):Math.max(0,it.max-cnt);
      }
    }else it.val=o[c.id+"."+x.id];
    if(it.val===undefined)it.val=null;v.items.push(it);
  });
  return v;
}
function compVal(secId,stuId,sem,m,c){
  if(!c.sub){var o=gGet(secId,stuId,gKey(sem,m));return o[c.id]!=null?o[c.id]:null}
  var v=subVals(secId,stuId,sem,m,c),any=false,sum=0;
  v.items.forEach(function(it){if(it.val!=null){any=true;sum+=it.val}});
  return any?r2(sum):null;
}
var DEF_IDX={c1:0,c2:1,c3:2,c4:3};
function compName(c){return c.n||(DEF_IDX[c.id]!=null?L().compDef[DEF_IDX[c.id]]:t("newComp"))}
function maxSum(){return gbCfg().comps.reduce(function(a,c){return a+(+c.max||0)},0)}
function monthName(m){return t("monthN",{n:L().ord[m-1]||m})}
function semName(n){return t(n===2?"sem2":"sem1")}
function r2(x){return Math.round(x*100)/100}
function gKey(sem,m){return"s"+sem+"m"+m}
function gGet(secId,stuId,key){var a=D.gb[secId];a=a&&a[stuId];return(a&&a[key])||{}}
function gSet(secId,stuId,key,cid,val){
  var A=D.gb[secId]||(D.gb[secId]={}),B=A[stuId]||(A[stuId]={}),o=B[key]||(B[key]={});
  if(val==null)delete o[cid];else o[cid]=val;
  if(!Object.keys(o).length)delete B[key];
}
function mTotal(secId,stuId,sem,m){
  var sum=0,any=false;
  gbCfg().comps.forEach(function(c){var x=compVal(secId,stuId,sem,m,c);if(x!=null){sum+=x;any=true}});
  return any?r2(sum):null;
}
function sAvg(secId,stuId,sem){
  var c=gbCfg(),tot=0;for(var m=1;m<=c.months;m++){var x=mTotal(secId,stuId,sem,m);if(x==null)return null;tot+=x}
  return r2(tot/c.months);
}
function parseNum(v){
  v=String(v).replace(/[٠-٩]/g,function(d){return"٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[۰-۹]/g,function(d){return"۰۱۲۳۴۵۶۷۸۹".indexOf(d)}).replace(/[٫,]/,".").trim();
  if(v==="")return null;return /^\d+(\.\d+)?$/.test(v)?+v:NaN;
}
function schoolYear(){var d=new Date(),y=d.getFullYear();if(d.getMonth()<7)y--;return(y+1)+"-"+y}

/* manual fields are entered one at a time down the whole class (quiz 1 for everyone, then quiz 2) */
function evManSubs(){return evSubs().filter(function(x){return!srcOf(x.src)})}
function evCurSub(){var l=evManSubs();if(!l.length)return null;var c=l.filter(function(x){return x.id===D.ui.evSub})[0];return c||l[0]}
function evRowInner(s,stu,sem,m,cc){
  var cur=evCurSub();
  return subVals(s.id,stu.id,sem,m,cc).items.map(function(it){
    var x=it.val,nm=esc(subName(it.sub));
    if(!it.auto&&cur&&it.sub.id===cur.id)return'<span class="ql">'+nm+'</span><input class="gin'+(x!=null?" ok":"")+'" data-sub="'+it.sub.id+'" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-id="'+stu.id+'" value="'+(x!=null?x:"")+'" placeholder="/'+it.max+'">';
    return'<span class="eb'+(it.auto?"":" man")+(x!=null&&x<it.max?" lo":"")+'">'+(it.auto?"":"✍️ ")+nm+" <b>"+(x!=null?x:"–")+"</b>/"+it.max+"</span>"}).join("");
}
function renderEv(s,sem,m,cc){
  var r=evRange(sem,cc.ev),st=evStats(s.id,sem,cc.ev),man=evManSubs(),cur=evCurSub();
  var h='<div class="card note" style="margin-bottom:8px">'+t("evHelp",{c:esc(compName(cc)),a:r[0]?fmtD(r[0]):"?",b:r[1]?fmtD(r[1]):"?"})+
    (st.lessons?"":'<div class="warn">'+t("noLessonsEv")+"</div>")+"</div>";
  if(man.length){
    var done=function(x){return s.students.filter(function(stu){return gGet(s.id,stu.id,gKey(sem,m))[cc.id+"."+x.id]!=null}).length};
    h+='<div class="note" style="margin:0 2px 6px">'+t("evPick")+'</div><div class="chips" id="evSubs" style="margin-bottom:10px">'+man.map(function(x,i){
      return'<button class="chip'+(x===cur?" on":"")+'" data-esub="'+x.id+'">'+(i+1)+". "+esc(subName(x))+"<small>"+done(x)+" / "+s.students.length+"</small></button>"}).join("")+"</div>";
  }
  h+='<div class="list">';
  s.students.forEach(function(stu,i){
    var cv=compVal(s.id,stu.id,sem,m,cc),tt=mTotal(s.id,stu.id,sem,m);
    h+='<div class="stu gr ev"><span class="n">'+(i+1)+'</span><span class="nm">'+esc(stu.name)+'<div class="tot" id="gt_'+stu.id+'">'+(tt!=null?t("mTotal")+": "+tt+" / "+maxSum():"")+"</div></span>"+
      '<div class="evrow">'+evRowInner(s,stu,sem,m,cc)+'<span class="evt" id="ge_'+stu.id+'">'+(cv!=null?cv:"–")+" / "+cc.max+"</span></div></div>";
  });

$("gPasteGo").onclick=function(){
  var raw=$("gPasteTxt").value.replace(/\r/g,"");if(!raw.trim()){toast(t("pasteEmpty"));return}
  var c=gbCfg(),s=sec(D.ui.gSec),n=c.comps.length,M=c.months,sem=D.ui.gSem||1,mon=Math.min(D.ui.gMonth||1,M);
  var lines=raw.split("\n").filter(function(l){return l.trim()}),rows=[],withNames=false,k=0;
  lines.forEach(function(l){
    var cells=l.indexOf("\t")>=0?l.split("\t"):(/^[\s\d٠-٩۰-۹.,٫]+$/.test(l)?l.trim().split(/\s+/):[l]);
    cells=cells.map(function(x){return x.trim()});
    var ni=-1;for(var i=0;i<cells.length;i++){if(cells[i]!==""&&isNaN(parseNum(cells[i]))){ni=i;break}}

    while(vals.length&&vals[vals.length-1]==="")vals.pop();
    if(ni<0&&!vals.length)return;
    rows.push({name:name,vals:vals});k=Math.max(k,vals.length);
  });

  // decide target layout by column count
  var map=null,tg; // map: array of {m,cid} per column index (null = skip)
  var comp=c.comps.filter(function(x){return x.id===D.ui.gComp})[0];
  var manS=evSubs().filter(function(x){return!srcOf(x.src)});
  if(comp&&comp.sub&&k>=1&&k<=manS.length){map=manS.slice(0,k).map(function(x){return{m:mon,cid:comp.id+"."+x.id}});tg=t("tgtOne",{c:compName(comp)+" — "+manS.slice(0,k).map(subName).join("، "),m:semName(sem)})}
  else if(k===1&&comp){map=[{m:mon,cid:comp.id}];tg=t("tgtOne",{c:compName(comp),m:monthName(mon)})}
  else if(k===n||k===n+1){map=c.comps.map(function(x){return{m:mon,cid:x.id}});if(k===n+1)map.push(null);tg=t("tgtMonth",{m:monthName(mon)})}
  else if(k===M*n||k===M*(n+1)||k===M*(n+1)+1){
    map=[];var tot=k!==M*n;
    for(var m=1;m<=M;m++){c.comps.forEach(function(x){map.push({m:m,cid:x.id})});if(tot)map.push(null)}
    if(k===M*(n+1)+1)map.push(null);tg=t("tgtSem",{s:semName(sem)});
  }
  if(!map){info(t("pasteBadCols",{k:k,n:n}),true);return}
  var maxOf={};c.comps.forEach(function(x){if(x.sub)evSubs().forEach(function(z){if(!srcOf(z.src))maxOf[x.id+"."+z.id]=+z.max});else maxOf[x.id]=x.max});
  var byName={};s.students.forEach(function(st){byName[normName(st.name)]=st});
  var plan=[],unmatched=[],over=0,count=0,seen={};
  rows.forEach(function(r,i){
    var st=withNames?(r.name?byName[normName(r.name)]:null):s.students[i];
    if(!st){if(withNames&&r.name)unmatched.push(r.name);return}
    var any=false;
    r.vals.forEach(function(v,j){
      var tgt=map[j];if(!tgt||!(tgt.cid in maxOf))return;var x=parseNum(v);if(x==null)return;

    });

  });

  if(unmatched.length)msg+="\n\n"+t("pasteUnmatched",{u:unmatched.length,list:unmatched.slice(0,5).join("، ")+(unmatched.length>5?"…":"")});
  if(over)msg+="\n\n"+t("pasteOver",{b:over});
  if(!withNames&&rows.length!==s.students.length)msg+="\n\n"+t("pasteCount",{l:rows.length,s:s.students.length});
  ask(msg,function(){
    plan.forEach(function(p){gSet(s.id,p.st,p.key,p.cid,p.v)});save();
    $("gPaste").classList.add("hidden");$("gPasteTxt").value="";
    if(k>1)D.ui.gComp="all";renderGr();toast(t("pasteDone",{n:plan.length}));
  });
};

var TT_P=8,TT_DEF={np:6,one:false,mStart:"08:00",eStart:"12:30",len:40,gap:5,breakAfter:3,breakLen:15,lead:5,atStart:true};
function ttCfg(){
  var x=D.tt||(D.tt={});
  if(!x.shifts||x.shifts.length!==5)x.shifts=["m","m","e","e","e"];
  x.grid=x.grid||[];for(var i=0;i<5;i++){x.grid[i]=x.grid[i]||[];for(var p=0;p<TT_P;p++)if(x.grid[i][p]===undefined)x.grid[i][p]=null}
  x.times=x.times||{};for(var k in TT_DEF)if(x.times[k]==null||x.times[k]==="")x.times[k]=TT_DEF[k];
  return x;
}
function ttP(){var n=+ttCfg().times.np;return n>=4&&n<=8?n:6}
function ttOne(){return!!ttCfg().times.one}
function toMin(s){var p=String(s||"0:0").split(":");return(+p[0]||0)*60+(+p[1]||0)}
function hm(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60)}
function hmD(d){return pad(d.getHours())+":"+pad(d.getMinutes())}
function ttTimes(sh){
  var c=ttCfg().times,s=toMin(sh==="m"||c.one?c.mStart:c.eStart),len=+c.len||40,o=[];
  for(var i=0;i<ttP();i++){o.push([s,s+len]);s+=len+(i+1===+c.breakAfter?(+c.breakLen||0):(+c.gap||0))}
  return o;
}
function secOk(id){return!!id&&D.sections.some(function(s){return s.id===id})}
var ORD_NUM=[["الثاني عشر","12"],["الحادي عشر","11"],["العاشر","10"],["التاسع","9"],["الثامن","8"],["السابع","7"],["دوازد","12"],["یازد","11"],["دەه","10"]];
function gShort(g){
  var n=String(g.name||"").replace(/[٠-٩]/g,function(d){return"٠١٢٣٤٥٦٧٨٩".indexOf(d)}),m=n.match(/\d+/);if(m)return m[0];
  for(var i=0;i<ORD_NUM.length;i++)if(n.indexOf(ORD_NUM[i][0])>=0)return ORD_NUM[i][1];

function ttLessons(){
  var out=[],now=new Date(),c=ttCfg();
  for(var off=0;off<8;off++){
    var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+off),wd=d.getDay();if(wd>4)continue;
    var tm=ttTimes(c.shifts[wd]);
    c.grid[wd].forEach(function(id,p){if(p>=ttP()||!secOk(id))return;
      out.push({di:wd,p:p,sid:id,start:new Date(d.getTime()+tm[p][0]*60000),end:new Date(d.getTime()+tm[p][1]*60000)})});
  }

}

  var now=new Date(),lead=(+ttCfg().times.lead||0)*60000,today=ymd(now);

var ttAlertsOn=false,ttAudio=null,ttFired={},ttAutoKey=null,ttFlash=null,baseTitle=document.title;

  for(var i=0;i<n;i++){var o=ttAudio.createOscillator(),g=ttAudio.createGain(),st=t0+i*.45;
    o.type="sine";o.frequency.value=i%2?660:880;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.4,st+.03);g.gain.exponentialRampToValueAtTime(.0001,st+.38);
    o.connect(g);g.connect(ttAudio.destination);o.start(st);o.stop(st+.4)}
  }catch(e){}
}

    else if(c.times.atStart&&now>=l.start&&now-l.start<90000&&!ttFired[k+"s"]){ttFired[k+"s"]=1;ttFire("now",l)}

    var nl=ttToday();if(nl&&$("tDate").value===ymd(new Date())&&ttAutoKey!==lessonKey(nl)){ttAutoKey=lessonKey(nl);D.ui.sec=nl.sid;filterTxt=""}
  }
  ensureSel();

  if(v==="stu"){var keep=$("sSec").value;fillSelect($("sSec"),keep&&D.sections.some(function(s){return s.id===keep})?keep:D.ui.sec);loadNames()}
  if(v==="rep"){var k2=$("rSec").value;$("rSec").dataset.k="";fillSelect($("rSec"),k2&&D.sections.some(function(s){return s.id===k2})?k2:D.ui.sec);periods();renderRep()}
  if(v==="set")renderSet();
  if(v==="gr")renderGr();
  if(v==="set")renderLocks();
  applyLocks();
  $("navGr").classList.toggle("hidden",!gbCfg().on);
  window.scrollTo(0,0);
}
